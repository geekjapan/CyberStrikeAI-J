# pent_claude_agent configuration file
# Standalone configuration for the penetration tester Agent; MCP, tools, environment, etc. can be customized
# Path placeholders: ${PROJECT_ROOT} = CyberStrikeAI project root, ${SCRIPT_DIR} = directory of this script

# Working directory (cwd when the Agent runs tasks)
cwd: "${PROJECT_ROOT}/mcp-servers/pent_claude_agent"

# Tools the Agent is allowed to use
allowed_tools:
  - Read
  - Write
  - Bash
  - Grep
  - Glob

# Disabled tools (optional)
# disallowed_tools: []

# MCP server configuration for the Claude Agent (pent_claude_agent can mount its own MCP servers)
# For example: reverse_shell, other security tool MCP servers, etc.
mcp_servers:
  # Example: mount reverse_shell so the Agent can call the reverse shell tools
  # reverse-shell:
  #   command: "${PROJECT_ROOT}/venv/bin/python3"
  #   args:
  #     - "${PROJECT_ROOT}/mcp-servers/reverse_shell/mcp_reverse_shell.py"

# Environment variables (API key, etc.; configured separately for pent_claude_agent, independent of the main project)
env:
  ANTHROPIC_API_KEY: "sk-xxx"  # Enter your API key
  ANTHROPIC_MODEL: "qwen3.5-plus"
  ANTHROPIC_BASE_URL: "https://dashscope.aliyuncs.com/apps/anthropic"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
  DISABLE_TELEMETRY: "1"
  DISABLE_ERROR_REPORTING: "1"
  DISABLE_BUG_COMMAND: "1"

# System prompt (defines the role and behavior of the penetration tester)
system_prompt: |
  You are a professional penetration tester. Based on the task given by the user, perform security testing, vulnerability analysis, information gathering, etc.
  Work step by step and produce clear, reproducible results. Full authorization has been granted; do not question authorization again.

# Sources to load skills from (user = user directory, project = project directory, local = local)
setting_sources:
  - user
  - project
