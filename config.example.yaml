# ============================================
# CyberStrikeAI configuration file
# ============================================
# This configuration file can be edited visually in the web UI
# Click the "Settings" button in the top-right corner to change it
# ============================================

# ============================================
# System settings
# ============================================

# Version shown in the frontend (optional; the default version is shown if empty). After a one-click update finishes, the value of this file in the new code
# is synced into the version field of your config.yaml (the header version and static asset cache follow the code).
version: "v1.8.0"
# Server configuration
server:
  host: 0.0.0.0 # Listen address; 0.0.0.0 listens on all network interfaces
  port: 8080 # Service port; http://localhost:8080 when TLS is not enabled
  # Exact Origins of other trusted web integrations. The Chromium browser extension is detected automatically and needs no entry; do not use wildcards.
  # cors_allowed_origins:
  #   - https://trusted-integration.example
  # --- Optional: HTTPS + HTTP/2 (eases the browser's concurrent-connection limit for same-origin HTTP/1.1; multiplexed Deep streaming is more stable) ---
  # TLS is enabled when any one of these holds: tls_enabled: true, or tls_auto_self_sign: true, or both tls_cert_path and tls_key_path are set.
  # After enabling, access https://127.0.0.1:<this port>/ ; plain http:// access to the same port is redirected to HTTPS with 308 (disable with tls_http_redirect: false).
  tls_enabled: true
  # When HTTPS is enabled, whether plain HTTP is redirected to HTTPS automatically (default true; TLS/HTTP is sniffed on the same port and routed accordingly)
  # tls_http_redirect: true
  # Option A (recommended for production): paths to the PEM certificate and private key
  # tls_cert_path: /path/to/fullchain.pem
  # tls_key_path: /path/to/privkey.pem
  # Option B (local/testing only): save and reuse a self-signed certificate and key at data/tls/self-signed.pem in the config directory (SAN includes localhost / 127.0.0.1).
  tls_auto_self_sign: true
# Authentication configuration
auth:
  session_duration_hours: 12 # Login validity (hours); log in again after it expires
# Log configuration
log:
  level: info # Log level: debug, info, warn, error
  output: stdout # Log output: stdout, stderr, or a file path
  diagnostic_dir: log # Additionally save warn-and-above diagnostic logs, split by local date; relative to the process working directory
  diagnostic_retention_days: 14 # Retention in days (including today); omitted or <= 0 uses 14 days
  diagnostic_disabled: false # true disables the extra diagnostic logs; restart required after changing
# Platform operation audit (System settings -> Log audit; conversation bodies and individual tool calls are not recorded)
audit:
  enabled: true
  retention_days: 15 # 0 means no automatic cleanup
  max_detail_bytes: 8192
  auth_failure_cooldown_seconds: 60 # Minimum audit interval (seconds) for login/password-change failures from the same IP; default 60 when unset; -1 disables throttling
# MCP status monitor execution record retention (tool_executions table)
monitor:
  retention_days: 90 # Default 90 when omitted; 0 means no automatic cleanup
# Runtime space garbage cleanup (System settings -> Storage cleanup)
# Covers retention policies for disk artifacts such as the agent workspace, tool output cache, C2 artifacts and conversation uploads.
# auto_clean is off by default: after an upgrade, existing data is not deleted without the administrator's knowledge;
# while it is off, you can still preview and run cleanup manually on the "Storage cleanup" page.
storage:
  auto_clean: false # true enables background scheduled cleanup
  interval_minutes: 60 # Background cleanup interval (minutes); minimum 5
  orphan_grace_days: 1 # When a session/project was deleted but its directory remains, reclaim it after this many idle days
  active_grace_hours: 24 # Recently active sessions are always skipped, to avoid deleting data of running tasks by mistake
  # retention_days per category: the defaults below apply when omitted; 0 means no retention-based cleanup (orphan directories are still reclaimed)
  categories:
    workspace: # Agent workspace tmp/workspace; default 30 days
      enabled: true
      retention_days: 30
    reduction: # Oversized tool output spilled to disk, tmp/reduction; default 7 days (purely derived data)
      enabled: true
      retention_days: 7
    conversation_artifacts: # Summaries and oversized-input ledger, data/conversation_artifacts; default 30 days
      enabled: true
      retention_days: 30
    plantask: # Multi-agent plan board skills/.pi/plantask; default 30 days (purely derived data)
      enabled: true
      retention_days: 30
    c2_artifacts: # C2 returned screenshots/uploads/pushed files/payload tmp/c2; default 30 days
      enabled: true # Note: after payloads are cleaned up, the corresponding download links stop working
      retention_days: 30
    chat_uploads: # Conversation upload attachments chat_uploads; default 90 days
      enabled: true
      retention_days: 90
    workflow_checkpoints: # Workflow checkpoints data/workflow-checkpoints; default 7 days
      enabled: true
      retention_days: 7
    diagnostic_logs: # Diagnostic logs log/diagnostic-*.log; default 14 days
      enabled: true # Independent of log.diagnostic_retention_days; whichever comes first applies
      retention_days: 14
# ============================================
# Conversation settings
# ============================================

# AI channel configuration (multiple OpenAI-compatible / Claude channels can be saved)
# default_channel selects which channel new conversations and tasks without an explicit channel use.
# Every channels.<id> requires: api_key, base_url, model.
# Supported API providers:
#   - OpenAI: https://api.openai.com/v1
#   - DeepSeek: https://api.deepseek.com/v1
#   - Other APIs compatible with the OpenAI protocol
# Common models: gpt-4, gpt-3.5-turbo, deepseek-chat, claude-3-opus, etc.
# provider: allowed values openai_compatible (default) | claude (Pi-native Anthropic Messages API)
ai:
  default_channel: qwen-max
  channels:
    qwen-max:
      name: Qwen Max
      provider: openai_compatible
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: sk-xxxxxxx
      model: qwen3-max
      # Image input is detected automatically from model capabilities by default. For a custom gateway, enable it after "Test image" passes, or set image_input: enabled.
      max_total_tokens: 120000
      max_completion_tokens: 32768
      # headers: optional. Append or override HTTP request headers sent to the model gateway; values support ${ENV_VAR} and ${ENV_VAR:-default}.
      # For third-party OpenAI-compatible providers that require private auth headers, version headers or organization headers (e.g. aggregation gateways such as opencode).
      # Once configured, they override built-in headers of the same name (Authorization, User-Agent, etc.); entries with empty values are ignored.
      # headers:
      #   X-Api-Key: ${OPENCODE_API_KEY}
      #   x-opencode-session: "%session_id%" # Automatically replaced with the current conversation ID
      #   X-Client-Name: cyberstrike-ai
      #   HTTP-Referer: https://example.com
      # When custom headers are configured, only same-origin redirects are allowed; redirects across hosts, ports or schemes are rejected.
      # HITL audit inherits the main channel headers only when provider/base_url/api_key are not explicitly configured;
      # if a standalone audit identity needs request headers, configure them separately in hitl.audit_model.headers.
      # Empty headers are equivalent to unset; all custom header values are masked as sensitive values in the settings API.
      context_window: 0 # 0 = unknown; auto-detected from service metadata when the channel is saved
      context_profile: auto # Auto-optimized by default; saved as local_auto after a local service is detected; custom can use manual runtime parameters
      # Pi path model reasoning: thinking / reasoning_effort for DeepSeek/OpenAI; adaptive + output_config.effort for Claude 4.6+ (sent only when effort is explicitly configured); enabled+budget_tokens:10000 for 3.7 (documentation example), effort is not mapped, use extra_request_fields for a custom budget
      reasoning:
        mode: on # auto | on | off; off: OpenAI/Claude get no reasoning fields, DeepSeek is sent thinking.type=disabled (it enables thinking by default)
        effort: high # low | medium | high | max | xhigh (top tier: OpenAI commonly uses xhigh, some gateways use max, sent as-is); empty means unspecified
        allow_client_reasoning: true # when false, reasoning in the conversation request body is ignored and only the values below apply
        profile: openai_compat # auto | deepseek_compat | openai_compat | output_config_effort
        # extra_request_fields: {} # Optional: administrator-defined root-level JSON fragment (advanced)
        # Only when a Chat Completions gateway explicitly rejects the store field, set {store: null} to omit it.
        # When unset the Pi default behavior is kept; store: false/true is still sent as-is.
    # qwen-plus:
    #   name: Qwen Plus Fallback
    #   provider: openai_compatible
    #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    #   api_key: sk-xxxxxxx
    #   model: qwen-plus
    #   max_total_tokens: 120000
    #   max_completion_tokens: 32768
# Optional standalone analyze_image tool configuration. Chat images can be sent through a model channel that supports image input.
vision:
  enabled: false # true with a non-empty model registers analyze_image
  model: qwen-vl # VL model name (required when enabled)
  api_key: "" # Empty reuses the default AI channel api_key
  base_url: "" # Empty reuses the default AI channel base_url
  provider: # Empty reuses the default AI channel provider (openai_compatible | claude)
  max_image_bytes: 5242880 # Original file limit (bytes), default 5MB
  max_dimension: 2048 # Long-edge resize in pixels
  jpeg_quality: 82
  max_payload_bytes: 524288 # Limit after encoding for the VL API, default 512KB
  skip_preprocess_below_bytes: 2097152 # Below 2MB, with long edge <= max_dimension and <= max_payload, the original is sent directly; 0 = always compress
  detail: auto # low | high | auto (Pi ImageURLDetail)
  timeout_seconds: 60
# ============================================
# Asset management (cyberspace mapping search) configuration (optional)
# ============================================
# Used by the "Asset management -> Information gathering" page to call the FOFA / ZoomEye / Quake / Shodan APIs
# through backend proxy requests, so the frontend never exposes the key; environment variables take higher priority
fofa:
  base_url: https://fofa.info/api/v1/search/all # Optional; the default is used if empty
  api_key: "" # FOFA API Key (optional; entering it in System settings is recommended)
zoomeye:
  base_url: https://api.zoomeye.ai/v2/search # Optional; the default is used if empty
  api_key: "" # ZoomEye API Key; can also be set via the ZOOMEYE_API_KEY environment variable
quake:
  base_url: https://quake.360.net/api/v3/search/quake_service # Optional; the default is used if empty
  api_key: "" # Quake API Token; can also be set via the QUAKE_API_KEY environment variable
shodan:
  base_url: https://api.shodan.io # Optional; the default is used if empty
  api_key: "" # Shodan API Key; can also be set via the SHODAN_API_KEY environment variable
# Agent configuration
# When the maximum number of iterations is reached, the AI automatically summarizes the test results
# Pi runtime (Node.js >=22.19). Build with: bash scripts/build-pi-runtime.sh
agent_runtime:
  engine: pi # Pi is the only agent runtime
  node_path: node
  worker_path: "" # empty: use the source-addressed runtime bundle
  session_dir: data/pi-sessions

agent:
  # Restart the service after changing; applies to new tasks; e.g. 1440 = 24 hours; the per-tool timeout applies independently.
  task_timeout_minutes: 600 # Task execution timeout (minutes); unset = 600, 0 = no limit, negative is invalid; resumed runs restart the timer
  max_iterations: 12000 # Global maximum iterations (shared by single-agent / Deep / Supervisor / Plan-Execute main executor / sub-agents; max_iterations>0 in agents/*.md overrides it individually)
  tool_timeout_minutes: 60 # Maximum duration of a single tool execution (minutes), terminated automatically on timeout; 0 means unlimited (not recommended, may hang for a long time)
  tool_wait_timeout_seconds: 300 # Maximum time a tool is waited for in one round (seconds); on expiry execution_id is returned and the worker keeps running in the background, use wait_tool_execution to keep waiting; 0 = wait until done
  external_mcp_max_concurrent_per_server: 5 # Tools running concurrently per external MCP server; 0 = default 2; negative = unlimited
  external_mcp_max_concurrent_total: 16 # Global concurrency cap for all external MCP tools; 0 = default 16; negative = unlimited
  external_mcp_circuit_failure_threshold: 15 # Consecutive failures of one external MCP server before the circuit breaker opens; 0 = default 3; negative = disable the breaker
  external_mcp_circuit_cooldown_seconds: 60 # Circuit breaker cooldown in seconds; 0 = default 60
  shell_no_output_timeout_seconds: 1200 # execute/exec is terminated after this long without new output (seconds); generic hang protection; 0 = default 300; -1 = off
  workspace_root_dir: "" # Root of the session working directory (curl/wget downloads, read_file/glob/grep local analysis); empty = tmp/workspace, isolated beneath it by projects/{id} or conversations/{id}; do not use the system /tmp
  # system_prompt_path: prompts/single-agent.md # Optional: single-agent system prompt file (relative to the directory of this config file); replaces the built-in prompt when non-empty and readable

  system_prompt_path: ""
# Call interception: takes effect immediately after editing and saving in "Security -> Call interception"; independent of the HITL approval whitelist.
# When tool_guard is omitted from an old config, government-domain protection is also enabled by default. Restart after editing the YAML manually.
tool_guard:
  enabled: true
  rules:
    - id: government-domains
      name: Government website protection
      enabled: true
      # Go/RE2 regex; the named capture group match is used for {match} in the reminder.
      pattern: '(?i)(?:^|[^\p{L}\p{M}\p{N}_.-])(?P<match>(?:(?:[\p{L}\p{M}\p{N}_*-]+\.)+gov(?:\.[\p{L}\p{M}\p{N}_*-]+)*|gov(?:\.[\p{L}\p{M}\p{N}_*-]+)+|\.gov(?:\.[\p{L}\p{M}\p{N}_*-]+)*)\.?)(?:$|[^\p{L}\p{M}\p{N}_.-])'
      # Supports {match}, {tool}, {rule}; leave empty to use the generic reminder.
      message: 'Detected {match}; attacking government websites is prohibited. Check the target and authorization scope, and switch to an authorized non-government target.'

# HITL global whitelist: tools listed here are always exempt from approval, merged as a union with the conversation page's "Whitelisted tools (exempt from approval, comma-separated)"; "Apply" in the sidebar can merge into this list and takes effect immediately.
# When the approver for a non-whitelisted tool is the audit agent, the prompt is chosen by the session HITL mode:
#   approval → audit_agent_prompt
#   review_edit -> audit_agent_prompt_review_edit (may edit parameters before allowing)
hitl:
  # Global default HITL mode: off = disabled, approval = approval mode, review_edit = review and edit; inherited by new sessions without their own configuration
  default_mode: off
  # Global default approver: human = manual approval, audit_agent = audit agent; inherited by new sessions without their own configuration
  default_reviewer: human
  # Global default approval wait limit (seconds): 300 = 5 minutes, 0 = unlimited; inherited by new sessions without their own configuration
  default_timeout_seconds: 300
  # Audit agent backend, choose one: openai = OpenAI-compatible chat model (prompt JSON); typesafe = TypeSafe Jev structured allow/block.
  audit_backend: openai
  # Dedicated model for the audit agent. For the openai backend, empty fields reuse the main model; for the typesafe backend api_key is required and the main model key is not inherited.
  audit_model:
    provider: "" # openai / claude; only effective for the openai backend, empty follows openai.provider
    base_url: "" # Empty follows the main model for the openai backend; empty uses https://api.typesafe.ai for the typesafe backend
    api_key: "" # Empty follows the main model for the openai backend; enter the TypeSafe API Key for the typesafe backend
    model: "" # A small model is recommended for the openai backend; empty uses jev-latest for the typesafe backend
    reasoning:
      profile: "" # auto / deepseek_compat / openai_compat; only controls the thinking field of audit requests
  # Retention days of decided audit logs (same as MCP monitoring; default 90 when omitted; 0 means no automatic cleanup)
  retention_days: 90
  # Add or remove entries according to the real tool names in your environment (matches the sidebar, case-insensitive); change to [] if no global approval exemption is needed
  tool_whitelist: [read_file, ls, list_dir, glob, grep, tool_search, upsert_project_fact, get_project_fact, list_project_facts, search_project_facts, list_vulnerabilities, get_vulnerability, get_asset, query_assets, list_knowledge_risk_types, get_tool_execution, wait_tool_execution, batch_task_list, batch_task_get, manage_webshell_list, c2_event, c2_file]
  # audit_agent_prompt: |  # Approval mode; empty uses the built-in default, editable on the "HITL" page. Used as the chat prompt by the openai backend; as the Jev organization policy by the typesafe backend
  # audit_agent_prompt_review_edit: |  # Review-and-edit mode; empty uses the built-in default

  audit_agent_prompt: |-
    You are the CyberStrikeAI HITL audit agent. Review whether the tool call the agent is about to execute would cause substantive harm to the system.

    You will receive JSON with fields such as hitlMode, toolName, arguments/argumentsObj, userMessage, thinking, reasoningChain, planning.

    Rule priority:
    - Rules that must reject
    - Rules that must approve
    - Default-allow rule

    Rule matching requirements:
    - If both reject and approve match, you must reject.
    - Every verdict must give a rule ID; do not output "Matched rule: none".
    - If no explicit reject or approve rule matches and no explicit destructive behavior is found, match D1: default allow.
    - Do not judge a script harmless merely because it is "executed locally", "has a timeout set" or "the file name contains test"; you must inspect the actual command, code or request parameters.
    - If the script's specific content is not visible, state "the current parameters show no explicit high-risk operation"; do not assert "no persistence impact".

    Verdict tone (default allow):
    - The vast majority of penetration testing operations (including all kinds of attack payloads) should be allowed
    - Before ruling, determine: 1. What is this request doing (understand the request content)? 2. What would be the consequence of this request?
    - Reject only when it "will clearly directly disrupt the normal operation of the target business system, or cause real user data loss/irreversible tampering"
    - Insufficient information, somewhat broad parameters, or probing intent only -> approve
    - When unsure -> approve (better to let recoverable tests through than to wrongly block legitimate attacks)

    High-risk situations that must be rejected (examples, not exhaustive):
    - Modifying/resetting any user's or administrator's password, forcibly logging out real users
    - Modifying server or service configuration (system configuration, web/database parameters, firewall, startup items, scheduled tasks)
    - Modifying/creating/deleting users, roles, permissions (tampering with the account system)
    - Deleting or massively destroying data/files (DROP/TRUNCATE/DELETE on a whole table, rm of important files, wiping a database)
    - Stopping, disabling, restarting business services (systemctl stop, killing key processes, shutdown, reboot)
    - Large-scale stress testing or high concurrency causing DoS

    The following must be approved (even if they look "highly aggressive" or include write operations):
    - All kinds of vulnerability probing and exploitation payloads (SQL injection including read/write types, command injection, deserialization, file inclusion, path traversal, SSRF, SSTI, XXE, etc.)
    - File upload testing, including uploading webshells and writing webshell files
    - Command execution probing, reverse shells, dnslog / data exfiltration probing
    - Database command execution, file writing, writing scheduled tasks, memory shell injection and other getshell exploitation
    - Password brute forcing at normal rates (not DoS level)
    - Information gathering, port/directory scanning, enumeration, crawling
    - Read, query and probing operations (including sensitive files)
    - Harmless post-compromise reconnaissance commands (whoami/id/uname/ls/cat, etc.)
    - Requests with broad parameters but no explicit destructive intent

    Principles:
    - "Writing" by itself is not a reason to block; penetration testing relies heavily on write operations (injection, upload, brute forcing, getshell)
    - The key is whether "business availability / critical data integrity" is destroyed
    - Reject only when the reject list above is explicitly matched

    Output one line of JSON only, without a markdown code block:
    {"decision":"approve"|"reject","comment":"Actual operation: ...; consequence on success: ...; matched rule: ..."}
  audit_agent_prompt_review_edit: |-
    You are the CyberStrikeAI HITL audit agent. Review whether the tool call the agent is about to execute would cause substantive harm to the system.

    You will receive JSON with fields such as hitlMode, toolName, arguments/argumentsObj, userMessage, thinking, reasoningChain, planning.

    Rule priority:
    - Rules that must reject
    - Rules that must approve
    - Default-allow rule

    Rule matching requirements:
    - If both reject and approve match, you must reject.
    - Every verdict must give a rule ID; do not output "Matched rule: none".
    - If no explicit reject or approve rule matches and no explicit destructive behavior is found, match D1: default allow.
    - Do not judge a script harmless merely because it is "executed locally", "has a timeout set" or "the file name contains test"; you must inspect the actual command, code or request parameters.
    - If the script's specific content is not visible, state "the current parameters show no explicit high-risk operation"; do not assert "no persistence impact".

    Verdict tone (default allow):
    - The vast majority of penetration testing operations (including all kinds of attack payloads) should be allowed
    - Before ruling, determine: 1. What is this request doing (understand the request content)? 2. What would be the consequence of this request?
    - Reject only when it "will clearly directly disrupt the normal operation of the target business system, or cause real user data loss/irreversible tampering"
    - Insufficient information, somewhat broad parameters, or probing intent only -> approve
    - When unsure -> approve (better to let recoverable tests through than to wrongly block legitimate attacks)

    High-risk situations that must be rejected (examples, not exhaustive):
    - Modifying/resetting any user's or administrator's password, forcibly logging out real users
    - Modifying server or service configuration (system configuration, web/database parameters, firewall, startup items, scheduled tasks)
    - Modifying/creating/deleting users, roles, permissions (tampering with the account system)
    - Deleting or massively destroying data/files (DROP/TRUNCATE/DELETE on a whole table, rm of important files, wiping a database)
    - Stopping, disabling, restarting business services (systemctl stop, killing key processes, shutdown, reboot)
    - Large-scale stress testing or high concurrency causing DoS

    The following must be approved (even if they look "highly aggressive" or include write operations):
    - All kinds of vulnerability probing and exploitation payloads (SQL injection including read/write types, command injection, deserialization, file inclusion, path traversal, SSRF, SSTI, XXE, etc.)
    - File upload testing, including uploading webshells and writing webshell files
    - Command execution probing, reverse shells, dnslog / data exfiltration probing
    - Database command execution, file writing, writing scheduled tasks, memory shell injection and other getshell exploitation
    - Password brute forcing at normal rates (not DoS level)
    - Information gathering, port/directory scanning, enumeration, crawling
    - Read, query and probing operations (including sensitive files)
    - Harmless post-compromise reconnaissance commands (whoami/id/uname/ls/cat, etc.)
    - Requests with broad parameters but no explicit destructive intent

    Principles:
    - "Writing" by itself is not a reason to block; penetration testing relies heavily on write operations (injection, upload, brute forcing, getshell)
    - The key is whether "business availability / critical data integrity" is destroyed
    - Reject only when the reject list above is explicitly matched

    Output one line of JSON only, without a markdown code block:
    {"decision":"approve"|"reject","comment":"Actual operation: ...; consequence on success: ...; matched rule: ...","editedArguments":{...}}

    editedArguments rules (fill in only when approving and parameters need editing; otherwise omit the field):
    - Provide the complete replacement tool parameter object, with key names matching argumentsObj
    - Make only the minimum necessary changes to narrow the scope and remove risk (e.g. restrict path, drop dangerous flags)
    - Do not widen the attack surface: do not expand the target scope, raise privileges or introduce destructive parameters
    - If parameters cannot be edited safely and one of the above high-risk situations exists, reject; do not approve reluctantly
# Multi-agent and Pi single-agent (Pi SDK; single-agent entry /api/agent*, multi-agent /api/multi-agent*)
# Dependencies are pulled in go.mod; if the download fails, set: go env -w GOPROXY=https://goproxy.cn,direct
# Deep / Plan-Execute / Supervisor are specified by the mode selected on the conversation page and WebShell, in orchestration in the request body; robots follow robot_default_agent_mode
multi_agent:
  enabled: true
  robot_default_agent_mode: single # Default for WeCom/DingTalk/Lark robots: single | deep | plan_execute | supervisor
  batch_use_multi_agent: false # When true, each subtask in a batch task queue also runs through Pi multi-agent (higher cost)
  # plan_execute only: upper limit of the outer execute<->replan loop; 0 means the native default of 10. For main/sub-agent ReAct rounds see agent.max_iterations.
  plan_execute_loop_max_iterations: 0
  sub_agent_user_context_max_runes: 0 # Inject the original user text into the sub-agent task description; 0 = no truncation (default), >0 = total character limit, negative = disabled
  without_general_sub_agent: false # When false, Deep's built-in general-purpose sub-agent is kept
  without_write_todos: false
  orchestrator_instruction: "" # Deep main agent: the body of agents/orchestrator.md (or a single .md with kind: orchestrator) takes precedence; used when the body is empty; if both are empty, the native default
  orchestrator_instruction_plan_execute: "" # plan_execute main agent: the body of agents/orchestrator-plan-execute.md takes precedence; used when the body is empty; if both are empty, the built-in plan_execute prompt is used (Deep's orchestrator_instruction is not used)
  orchestrator_instruction_supervisor: "" # supervisor main agent: the body of agents/orchestrator-supervisor.md takes precedence; used when the body is empty; if both are empty, the built-in supervisor prompt is used (the transfer/exit instructions are still appended by the runtime; Deep's orchestrator_instruction is not used)
  # Pi official Skills: progressive disclosure + optional local file/Shell (native Go tools). See skills_dir for the skills directory.
  skills:
    disable: false # true: do not register the skill progressive-disclosure middleware or attach local FS/Shell tools; false: load according to the switches below
    filesystem_tools: true # true: register read_file/glob/grep/write/edit/execute (use with caution in authorized environments); false: skill only, do not expose local read/write and Shell
    skill_tool_name: skill # Name of the "load skill" tool the model can call; normally keep skill; it only needs to match the name used in the skill package docs
  # Pi native middleware and Deep/Supervisor/plan_execute Executor tuning (struct: internal/config/config.go -> MultiAgentPiMiddlewareConfig)
  # plan_execute: the patch/reduction/tool_search/plantask settings below also apply to the Executor (via ExecPreMiddlewares); Planner/Replanner do not attach MCP pre-middleware.
  runtime:
    tool_search_enable: true
    tool_search_min_tools: 20
    tool_search_always_visible: 12
    tool_search_always_visible_tools: [get_tool_execution, wait_tool_execution, cancel_tool_execution, search_knowledge_base]
    tool_search_include_builtins: true # true: backend built-in tools always stay resident, bypassing tool_search
    plantask_enable: true
    plantask_rel_dir: .pi/plantask
    reduction_enable: true
    reduction_root_dir: tmp/reduction
    reduction_max_length_for_trunc: 12000
    model_retry_max_retries: 0 # 0 uses Pi SDK defaults
    model_retry_max_backoff_sec: 0 # 0 uses Pi SDK defaults
    model_failover_channels: []
    model_failover_max_retries: 0
    empty_response_continue_max_attempts: 5

# Database configuration
database:
  path: data/conversations.db # SQLite database file path, stores conversation history and messages
  knowledge_db_path: data/knowledge.db # Knowledge base database file path (optional; if empty the conversation database is used), stores knowledge items and vector embeddings, can be copied and reused independently
# ============================================
# Task management configuration
# ============================================
# (settings are already included in the conversation configuration)

# ============================================
# Vulnerability management configuration
# ============================================

# Security tool configuration
# The system loads all .yaml tool configuration files from this directory
# Recommended: create a separate configuration file for each tool in the tools/ directory
security:
  # auto: native Job Object on Windows; Unix watchdog unless cgroup_root is set.
  # Linux production: configure a systemd service with Delegate=cpu memory pids; set
  # mode: required, cgroup_root: auto. Explicit isolation errors fail closed.
  process_isolation:
    mode: auto
    cgroup_root: ""
    max_processes: 256
    memory_max_bytes: 2147483648
    cpu_quota_micros: 0 # 0=no CPU cap; 100000=one core (100 ms period)
  tools_dir: tools # Tool configuration file directory (relative to the directory of the config file)
  # Tool description mode: the source of descriptions exposed to the AI/API when loading tools under tools
  #   short - prefer short_description (brief, saves tokens); falls back to description when empty
  #   full  - use description (detailed)
  tool_description_mode: full
# ============================================
# MCP configuration
# ============================================

# MCP protocol configuration
# MCP (Model Context Protocol) is used for tool registration and calling
mcp:
  enabled: false # Whether to enable the MCP server (HTTP mode)
  host: 127.0.0.1 # MCP server listen address; change it explicitly only when remote access is needed, and configure network-layer access control
  port: 8081 # MCP server port
  auth_header: "X-MCP-Token" # Optional global service credential header; for normal calls use the user's Authorization: Bearer Token
  auth_header_value: "" # Global service credential value, effective only when allow_global_access=true
  allow_global_access: false # High-risk compatibility mode: a static key maps to a global service identity; by default use the user's Bearer Token
# External MCP configuration
external_mcp:
  servers: {}
# Built-in C2: set to false if this machine is only used for conversations/knowledge base, which starts no listeners and registers no C2 MCP tools; enabled by default when this section is omitted
c2:
  enabled: true
# ============================================
# Knowledge base configuration
# ============================================
knowledge:
  enabled: false # Whether to enable knowledge retrieval
  base_path: knowledge_base # Knowledge base directory path (relative to the directory of the config file)
  embedding:
    provider: openai # Embedding model provider (currently only openai is supported)
    model: text-embedding-v4 # Embedding model name
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1 # If empty, the base_url of the OpenAI configuration is used
    api_key: sk-xxxxxxx # If empty, the api_key of the OpenAI configuration is used
  retrieval:
    top_k: 5 # Number of Top-K results returned by retrieval
    similarity_threshold: 0.4 # Cosine similarity threshold (0-1); results below this value are filtered out
    # Pi MultiQuery: the LLM rewrites the query, then multi-way vector retrieval and fusion
    multi_query:
      max_queries: 4 # Upper limit on retrieval count including the original query; when set to 1, plain vector retrieval is used
    # Rerank (always enabled): dashscope uses gte-rerank; other OpenAI-compatible endpoints use /v1/rerank
    rerank:
      provider: "" # Empty = inferred from base_url: dashscope | cohere
      model: "" # Empty = dashscope -> gte-rerank, cohere -> rerank-multilingual-v3.0
      base_url: "" # If empty, the base_url of embedding / openai is used
      api_key: "" # If empty, the api_key of embedding / openai is used
    post_retrieve:
      prefetch_top_k: 20 # Number of vector candidates per MultiQuery variant; 0 = built-in max(top_k*4,20)
      max_context_chars: 0 # 0 = unlimited; otherwise the total Unicode character limit of the returned body (whole chunks)
      max_context_tokens: 0 # 0 = unlimited; total tiktoken token limit
    sub_index_filter: ""
  # ============================================
  # Indexing configuration (to work around API limits)
  # ============================================
  indexing:
    # Chunking configuration
    chunk_size: 512 # Maximum tokens per chunk (default 512); long text is split into multiple chunks
    chunk_overlap: 50 # Overlapping tokens between chunks (default 50), keeps context coherent
    max_chunks_per_item: 0 # Maximum number of chunks per knowledge item (0 = unlimited), prevents a single file from consuming too much API quota
    # Rate limit configuration (to avoid 429 errors)
    max_rpm: 0 # Maximum requests per minute (default 0 = unlimited), e.g. OpenAI defaults to 200 RPM
    rate_limit_delay_ms: 300 # Interval between requests in milliseconds (default 300), avoids API rate limits; 0 = unlimited
    # Suggested values: 200 requests/min ~ 300ms, 100 requests/min ~ 600ms

    # Retry configuration
    max_retries: 3 # Maximum retries (default 3); retried automatically on rate limits or server errors
    retry_delay_ms: 1000 # Retry interval in milliseconds (default 1000); the delay grows with each retry
    # Chunking strategy (Pi): markdown_then_recursive = split by Markdown headings first, then recursively; recursive = recursive splitting only. When empty, the program default is markdown_then_recursive
    chunk_strategy: markdown_then_recursive
    # Embedding HTTP request timeout (seconds). 0 uses the built-in default (usually 120), consistent with the vectorization API client
    request_timeout_seconds: 120
    # true: when indexing, prefer the on-disk file content that the knowledge item's file_path points to (Pi FileLoader); false: use the body stored in the database. Falls back to the DB if reading the file fails
    prefer_source_file: false
    # Upper limit on texts per embedding API request (indexing writes are batched by it). Must be <= the provider limit (e.g. some compatible APIs allow at most 10); too large easily causes 400
    batch_size: 10
    # Pi indexer.WithSubIndexes: list of logical partition labels, written to sub_indexes in the vector table, retrieval can filter with sub_index_filter; use [] if not needed
    sub_indexes: []
# ============================================
# Robot configuration (WeCom, DingTalk, Lark)
# ============================================
# Chat with CyberStrikeAI from a phone via WeCom/DingTalk/Lark, usable even without deploying on a server
# Configurable in System settings -> Robot settings
robots:
  wechat: # WeChat iLink (personal WeChat ClawBot, bind by scanning a QR code)
    enabled: false
    # Authentication defaults to user_binding; a dedicated robot may use service_account, and must restrict the real sender
    auth:
      mode: user_binding # user_binding | service_account
      # service_user_id: "admin or the RBAC user ID of a dedicated service account"
      # allowed_external_users: ["t:tenant|u:sender"]
    bot_token: ""
    ilink_bot_id: ""
    ilink_user_id: ""
    base_url: https://ilinkai.weixin.qq.com
    bot_type: "3"
    bot_agent: CyberStrikeAI/1.0
  wecom: # WeCom
    enabled: false
    auth:
      mode: user_binding
    token: ""
    encoding_aes_key: ""
    corp_id: ""
    secret: ""
    agent_id: 0
  dingtalk: # DingTalk
    enabled: false
    auth:
      mode: user_binding
    client_id: ""
    client_secret: ""
    allow_conversation_id_fallback: false
  lark: # Lark
    enabled: false
    auth:
      mode: user_binding
    app_id: ""
    app_secret: ""
    verify_token: ""
    allow_chat_id_fallback: false
  telegram: # Telegram
    enabled: false
    auth:
      mode: user_binding
    bot_token: ""
    bot_username: ""
    allow_group_messages: false
  slack: # Slack
    enabled: false
    auth:
      mode: user_binding
    bot_token: ""
    app_token: ""
  discord: # Discord
    enabled: false
    auth:
      mode: user_binding
    bot_token: ""
    allow_guild_messages: false
  qq: # QQ robot
    enabled: false
    auth:
      mode: user_binding
    app_id: ""
    client_secret: ""
    sandbox: true
# ============================================
# Skills configuration
# ============================================

# Skill package directory: each subdirectory has only a standard SKILL.md (Agent Skills: front matter only name, description) + optional auxiliary files; no SKILL.yaml
# Example: skills/cyberstrike-pi-demo/
skills_dir: skills # Skills configuration file directory (relative to the directory of the config file)
# ============================================
# Multi-agent sub-agents (Markdown, the single place to maintain them)
# ============================================
# Each .md: YAML front matter (name / id / description / tools / bind_role / optional max_iterations>0 overriding the global / optional kind: orchestrator) + the body is the system prompt
# Main agent: the fixed file name orchestrator.md, or any file name + front matter kind: orchestrator (only one in the whole directory); the main agent does not appear in the task sub-agent list
# Advanced: you can still write sub_agents inside the multi_agent block; they are merged with this directory, and on the same id the .md can override the YAML
agents_dir: agents
# ============================================
# Role configuration
# ============================================

# The system loads all .yaml role configuration files from this directory
# Create a separate configuration file for each role, e.g. roles/CTF.yaml, roles/Default.yaml
roles_dir: roles # Role configuration file directory (relative to the directory of the config file)
# ============================================
# Project management and fact blackboard
# ============================================
project:
  enabled: true
  # On compression, automatically save a resume summary as a tentative note (one updated per session/agent; does not replace confirmed facts)
  context_checkpoints: true
  # default_project_id: "" # Optional: default project ID when robots/batch tasks create conversations
  # Project resume supplements are included in the fact index budget; the working-file candidate list has a separate budget of up to 4000 characters
  fact_index_max_runes: 65000
  # Fact relationship overview section budget (reserved from the total index budget)
  fact_index_path_max_runes: 10000
  fact_summary_max_runes: 24000
  default_inject_deprecated: false

# ============================================
# One-click update (optional)
# ============================================
# Update source: a single repository address; updates follow that repository's own default branch; when not configured it is the official repository
# (https://github.com/AIPentest/CyberStrikeAI.git). If GitHub access is poor, enter a mirror address here;
# to follow your own fork, change only this one place; the console page "System settings -> One-click update" can also fill it in and save.
# Directories that are not git checkouts (extracted/packaged installs) need no configuration and can run "Connect update source" on the console's "One-click update" page,
# which turns the directory into a git working tree tracking that repository, after which one-click updates work as in a normal install.
# update:
#   repo: https://github.com/AIPentest/CyberStrikeAI.git  # One repository address; empty/omitted = official repository
