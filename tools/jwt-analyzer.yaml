name: "jwt-analyzer"
command: "jwt_tool"
enabled: true
short_description: "JWT analysis and vulnerability testing tool"
description: |
  Advanced JWT analysis and vulnerability testing tool for detecting security issues in JWT implementations.

  **Key features:**
  - JWT analysis
  - Vulnerability testing
  - Attack vector detection
  - Token manipulation

  **Use cases:**
  - JWT security testing
  - Token analysis
  - Vulnerability discovery
  - Security testing
parameters:
  - name: "jwt_token"
    type: "string"
    description: "JWT to analyze"
    required: true
    flag: "-t"
    format: "flag"
  - name: "target_url"
    type: "string"
    description: "Optional target URL for testing token manipulation"
    required: false
    flag: "-u"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional jwt-analyzer arguments. Used to pass jwt-analyzer options not defined in the parameter list.

      **Example values:**
      - Add common argument examples for the tool as needed

      **Notes:**
      - Separate multiple arguments with spaces
      - Make sure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
