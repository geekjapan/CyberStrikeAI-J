name: "pwninit"
command: "pwninit"
enabled: true
short_description: "CTF binary exploitation setup tool"
description: |
  Pwninit is a tool for setting up CTF binary exploitation challenges. It automatically configures libc and the loader.

  **Key features:**
  - Automatic libc identification
  - Loader configuration
  - Template generation
  - Environment setup

  **Use cases:**
  - CTF challenges
  - Exploit development
  - Environment configuration
  - Security research
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file"
    required: true
    position: 0
    format: "positional"
  - name: "libc"
    type: "string"
    description: "Path to the libc file"
    required: false
    flag: "--libc"
    format: "flag"
  - name: "ld"
    type: "string"
    description: "Path to the loader file"
    required: false
    flag: "--ld"
    format: "flag"
  - name: "template_type"
    type: "string"
    description: "Template type (python, c)"
    required: false
    flag: "--template"
    format: "flag"
    default: "python"
  - name: "additional_args"
    type: "string"
    description: |
      Additional pwninit arguments. Use it to pass pwninit options that are not defined in the parameter list.

      **Example values:**
      - Add common argument examples as appropriate for the tool

      **Notes:**
      - Separate multiple arguments with spaces
      - Make sure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
