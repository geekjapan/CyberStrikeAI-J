name: "hydra"
command: "hydra"
args: ["-I"]
enabled: true
short_description: "Password brute-forcing tool supporting many protocols and services"
description: |
  Hydra is a network login brute-forcing tool that supports many protocols, including SSH, FTP, HTTP, and SMB.

  **Usage rules (read first):**
  - A **username** is required: provide at least one of `username` (-l) or `username_file` (-L)
  - A **password** is required: provide at least one of `password` (-p), `password_file` (-P), or `-C` (via `additional_args`)
  - **Start with a small wordlist** (tens to hundreds of entries) and confirm the target is reachable before scaling up; do not default to huge wordlists such as rockyou
  - Enabled by default: stop on first hit (-f), 4 parallel tasks (-t), ignore restore file (-I); for long tasks set `output_file`

  **CLI order:** `hydra [options] <target> <service>` (this tool builds arguments in this order; do not put the target before the options)

  **Use cases:** Weak password detection and password strength assessment in authorized environments

  **Note:** Use only on authorized targets; for unresponsive targets, reduce `wait_time` or shrink the wordlist to avoid long hangs.
parameters:
  - name: "username"
    type: "string"
    description: "Single username (-l); provide this or username_file (at least one)"
    required: false
    flag: "-l"
    format: "flag"
  - name: "username_file"
    type: "string"
    description: "Username wordlist file (-L)"
    required: false
    flag: "-L"
    format: "flag"
  - name: "password"
    type: "string"
    description: "Single password (-p)"
    required: false
    flag: "-p"
    format: "flag"
  - name: "password_file"
    type: "string"
    description: "Password wordlist file (-P); prefer a small wordlist for trial runs"
    required: false
    flag: "-P"
    format: "flag"
  - name: "stop_on_first"
    type: "bool"
    description: "Exit immediately after finding a valid credential pair (-f, default true)"
    required: false
    flag: "-f"
    format: "flag"
    default: true
  - name: "tasks"
    type: "int"
    description: "Parallel connections per target (-t); 4 is recommended for SSH and similar, default 4"
    required: false
    flag: "-t"
    format: "flag"
    default: 4
  - name: "wait_time"
    type: "int"
    description: "Seconds to wait for a response per connection (-w), default 16 (lower than Hydra's default of 32 to reduce hangs)"
    required: false
    flag: "-w"
    format: "flag"
    default: 16
  - name: "wait_between"
    type: "int"
    description: "Seconds between connections per thread (-W), default 1"
    required: false
    flag: "-W"
    format: "flag"
    default: 1
  - name: "output_file"
    type: "string"
    description: "Write results to a file (-o); recommended for long tasks"
    required: false
    flag: "-o"
    format: "flag"
  - name: "target"
    type: "string"
    description: "Target IP, hostname, or CIDR (must come after the options)"
    required: true
    position: 1
    format: "positional"
  - name: "service"
    type: "string"
    description: "Service type (ssh, ftp, http-get, http-post-form, smb, etc.; see hydra -h)"
    required: true
    position: 2
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: "Additional arguments (e.g. -s port, -S SSL, -m module options, -C login:pass file), appended to the end of the command"
    required: false
    format: "positional"
