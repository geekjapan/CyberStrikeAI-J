name: "api-schema-analyzer"
command: "spectral"
args: ["lint"]
enabled: true
short_description: "API schema analysis tool that identifies potential security issues"
description: |
  Runs `spectral lint` to statically analyze OpenAPI/Swagger/GraphQL schemas; custom rulesets and output formats can be combined.
parameters:
  - name: "schema_url"
    type: "string"
    description: "API schema file or URL (the target passed to spectral lint)"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
      Additional Spectral arguments, such as `--ruleset`, `--format`, `--fail-severity`.
    required: false
    format: "positional"
