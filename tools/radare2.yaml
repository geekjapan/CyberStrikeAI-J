name: "radare2"
command: "r2"
enabled: true
short_description: "Binary analysis and reverse engineering framework with disassembly, debugging and scripted analysis"
description: |
  Radare2 is a complete binary analysis and reverse engineering framework that supports many architectures and file formats.

  **Key features:**
  - Disassembly and decompilation: supports many architectures (x86, ARM, MIPS, etc.)
  - Debugging: local and remote debugging
  - Scripting: supports r2pipe scripts and r2 command scripts
  - Many file formats: ELF, PE, Mach-O, firmware, etc.
  - Interactive analysis: command-line interface and visual mode
  - Automated analysis: batch and scripted analysis

  **Use cases:**
  - Binary file analysis
  - Reverse engineering and vulnerability research
  - Malware analysis
  - Reverse engineering challenges in CTF competitions
  - Firmware analysis
  - Exploit development

  **Notes:**
  - Use the -c option to run commands and then exit (non-interactive mode)
  - Use the -i option to run a script file
  - Use the -q option for quiet mode (no startup information)
  - Use the -A option to analyze the binary automatically
  - Use the -d option to attach to a process for debugging
parameters:
  - name: "target"
    type: "string"
    description: |
      Target file, process ID or special value.

      **Format:**
      - File path: "/path/to/binary"
      - Process ID: "1234" (requires the -d option)
      - Special values: "-" (read from stdin), "--" (interactive mode), "=" (read from environment variable)

      **Example values:**
      - Binary file: "/tmp/vulnerable"
      - Process debugging: "1234" (with -d)
      - From stdin: "-"

      **Notes:**
      - Required; must not be empty
      - If a process ID is given, use it together with the -d option
      - Note: radare2 requires the file path to be the last argument, so target uses position 1
    required: true
    position: 1
    format: "positional"
  - name: "commands"
    type: "string"
    description: |
      The Radare2 command to run. It can be a single command or several commands (separated by semicolons).

      **Format:**
      - Single command: "aaa" (auto analysis)
      - Multiple commands: "aaa; pdf @main; VV" (analyze, disassemble the main function, visual mode)

      **Common commands:**
      - "aaa": automatically analyze all functions
      - "afl": list all functions
      - "pdf @main": disassemble the main function
      - "px 64": show 64 bytes in hexadecimal
      - "VV": enter visual mode
      - "i": show file information
      - "iz": show strings

      **Example values:**
      - "aaa" (auto analysis)
      - "aaa; pdf @main" (analyze and disassemble the main function)
      - "i; iz" (show information and strings)

      **Notes:**
      - Separate multiple commands with a semicolon (;)
      - The program exits after the commands run (non-interactive mode)
    required: false
    flag: "-c"
    format: "flag"
  - name: "script_file"
    type: "string"
    description: |
      Path of the script file to run. The script file contains Radare2 commands, one per line.

      **Format:**
      - Script file path: "/path/to/script.r2"

      **Example values:**
      - "/tmp/analyze.r2"
      - "./scripts/auto_analyze.r2"

      **Notes:**
      - Commands in the script file run in order
      - The program exits after the script finishes
    required: false
    flag: "-i"
    format: "flag"
  - name: "arch"
    type: "string"
    description: |
      Specify the target architecture.

      **Common architectures:**
      - "x86": 32-bit x86
      - "x86_64": 64-bit x86
      - "arm": ARM architecture
      - "arm64": ARM64 architecture
      - "mips": MIPS architecture
      - "ppc": PowerPC architecture

      **Example values:**
      - "x86"
      - "x86_64"
      - "arm"
      - "arm64"

      **Notes:**
      - If not specified, radare2 tries to detect it automatically
      - Some architectures may need extra configuration
    required: false
    flag: "-a"
    format: "flag"
  - name: "bits"
    type: "int"
    description: |
      Specify the target bit width (16, 32, 64).

      **Example values:**
      - 16 (16-bit)
      - 32 (32-bit)
      - 64 (64-bit)

      **Notes:**
      - Usually used together with the -a option
      - If not specified, radare2 tries to detect it automatically
    required: false
    flag: "-b"
    format: "flag"
  - name: "auto_analyze"
    type: "bool"
    description: |
      Analyze the binary automatically. Equivalent to running the "aaa" command.

      **Use cases:**
      - Quick binary analysis
      - Batch analysis

      **Notes:**
      - When enabled, all functions are analyzed automatically
      - It may take a long time
    required: false
    flag: "-A"
    format: "flag"
    default: false
  - name: "debug"
    type: "bool"
    description: |
      Debug mode. Can attach to a process or debug a file.

      **Use cases:**
      - Attach to a running process
      - Debug a binary

      **Notes:**
      - Requires appropriate privileges
      - This option must be enabled if target is a process ID
    required: false
    flag: "-d"
    format: "flag"
    default: false
  - name: "quiet"
    type: "bool"
    description: |
      Quiet mode. Does not show startup information or the prompt.

      **Use cases:**
      - Scripted use
      - Batch analysis
      - Automated tool invocation

      **Notes:**
      - Suitable for non-interactive use
      - Reduces output noise
    required: false
    flag: "-q"
    format: "flag"
    default: false
  - name: "seek"
    type: "string"
    description: |
      Set the start address. It can be a hexadecimal address or an expression.

      **Format:**
      - Hexadecimal: "0x400000"
      - Expression: "main+0x10"

      **Example values:**
      - "0x400000"
      - "main"
      - "0x1000"

      **Notes:**
      - The address can be hexadecimal or a symbol name
      - Used to start analysis from a specific location
    required: false
    flag: "-s"
    format: "flag"
  - name: "base_address"
    type: "string"
    description: |
      Set the base address. Used as the load address.

      **Format:**
      - Hexadecimal address: "0x400000"

      **Example values:**
      - "0x400000"
      - "0x1000000"

      **Notes:**
      - Used to specify the load address of the binary
      - Commonly used when analyzing firmware or memory dumps
    required: false
    flag: "-B"
    format: "flag"
  - name: "eval"
    type: "string"
    description: |
      Set configuration variables. The format is key=value.

      **Format:**
      - "key=value"
      - Separate multiple variables with spaces: "asm.arch=x86 asm.bits=32"

      **Example values:**
      - "asm.arch=x86"
      - "asm.bits=32"
      - "scr.color=false"

      **Notes:**
      - Used to set radare2 configuration variables
      - Separate multiple variables with spaces
    required: false
    flag: "-e"
    format: "flag"
  - name: "project"
    type: "string"
    description: |
      Load or save a project file.

      **Format:**
      - Project file path: "/path/to/project.r2"

      **Example values:**
      - "./project.r2"
      - "/tmp/analysis.r2"

      **Notes:**
      - The project file stores the analysis state and configuration
      - Can be used to restore a previous analysis
    required: false
    flag: "-p"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional radare2 arguments. Use it to pass radare2 options that are not defined in the parameter list.

      **Available options:**
      - "-C": force color output
      - "-f": force opening the file (even if the format does not match)
      - "-L": list supported plugins
      - "-M": enable write mode
      - "-n": do not load the config file
      - "-N": do not run scripts
      - "-S": start in debug mode
      - "-t": use threaded mode
      - "-u": use the unicorn engine
      - "-v": show version information
      - "-w": write mode
      - "-z": scan strings
      - "-X": run an r2pipe script
      - "-P patch": apply a patch
      - "-m maddr": map an address

      **Example values:**
      - "-w" (write mode)
      - "-n" (do not load the config file)
      - "-M" (enable write mode)
      - "-z" (scan strings)

      **Notes:**
      - Separate multiple arguments with spaces
      - Make sure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
