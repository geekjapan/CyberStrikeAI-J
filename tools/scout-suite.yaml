name: "scout-suite"
command: "scout"
enabled: true
short_description: "Multi-cloud security assessment tool"
description: |
  Scout Suite is a multi-cloud security assessment tool that supports AWS, Azure, GCP, Aliyun and OCI.

  **Key features:**
  - Multi-cloud security assessment
  - Configuration auditing
  - Security best practice checks
  - Detailed report generation

  **Use cases:**
  - Cloud security auditing
  - Compliance checking
  - Security assessment
  - Cloud configuration auditing
parameters:
  - name: "provider"
    type: "string"
    description: "Cloud provider (aws, azure, gcp, aliyun, oci)"
    required: false
    flag: "--provider"
    format: "flag"
    default: "aws"
  - name: "profile"
    type: "string"
    description: "AWS configuration file"
    required: false
    flag: "--profile"
    format: "flag"
    default: "default"
  - name: "report_dir"
    type: "string"
    description: "Directory to save the report"
    required: false
    flag: "--report-dir"
    format: "flag"
    default: "/tmp/scout-suite"
  - name: "services"
    type: "string"
    description: "Specific service to assess"
    required: false
    flag: "--services"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional scout-suite arguments. Use it to pass scout-suite options that are not defined in the parameter list.

      **Example values:**
      - Add common argument examples as appropriate for the tool

      **Notes:**
      - Separate multiple arguments with spaces
      - Make sure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
