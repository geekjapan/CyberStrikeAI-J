name: "sqlmap"
command: "sqlmap"
enabled: true
# Short description (used in the tool list to reduce token usage)
short_description: "Automated SQL injection detection and exploitation tool for finding and exploiting SQL injection vulnerabilities"
# Detailed tool description
description: |
  Automated SQL injection detection and exploitation tool for finding and exploiting SQL injection vulnerabilities.

  **Key features:**
  - Automatically detects SQL injection vulnerabilities
  - Supports many database types (MySQL, PostgreSQL, Oracle, MSSQL, etc.)
  - Automatically extracts database information (tables, columns, data)
  - Supports many injection techniques (boolean-based blind, time-based blind, UNION query, etc.)
  - Supports advanced features such as file upload/download and command execution

  **Use cases:**
  - Web application security testing
  - SQL injection vulnerability detection
  - Database information gathering
  - Penetration testing and vulnerability verification

  **Notes:**
  - Use only for authorized security testing
  - Some operations may affect the target system
  - Verify in a test environment first
  - Use the --batch option to avoid interactive prompts
# Parameter definitions
parameters:
  - name: "url"
    type: "string"
    description: |
      Target URL, containing parameters that may be vulnerable to SQL injection.

      **Format requirements:**
      - A complete URL including the protocol (http:// or https://)
      - It must include query parameters; mark the injection point in a parameter value with *
      - Or provide the complete URL directly and sqlmap detects the parameters automatically

      **Example values:**
      - Marked injection point: "http://example.com/page?id=1*"
      - Complete URL: "http://example.com/page?id=1"
      - POST data: "http://example.com/login" (use together with the data parameter)
      - Cookie injection: "http://example.com/page" (use together with the cookie parameter)

      **Notes:**
      - The URL must be reachable
      - Make sure the URL format is correct and includes the protocol prefix
      - If you use a POST request, use it together with the data parameter
      - Required; must not be empty
    required: true
    flag: "-u"
    format: "flag"
  - name: "batch"
    type: "bool"
    description: |
      Non-interactive mode; automatically chooses default options and needs no user input.

      **Use cases:**
      - Automated test scripts
      - Batch scanning
      - Avoiding interactive prompts

      **Notes:**
      - Always set it to true so the tool does not wait for user input
      - The default is true
    required: false
    default: true
    flag: "--batch"
    format: "flag"
  - name: "level"
    type: "int"
    description: |
      Test level, range 1-5. The higher the level, the more thorough but slower the test.

      **Level descriptions:**
      - Level 1: basic tests, fast but may miss vulnerabilities
      - Level 2: default level, balances speed and coverage
      - Level 3: extended tests, more thorough detection
      - Level 4: deep tests, include more payloads
      - Level 5: most thorough tests, include all known techniques

      **Recommendations:**
      - Use 1-2 for quick scans
      - Use 3 for routine testing (default)
      - Use 4-5 for deep testing

      **Notes:**
      - The higher the level, the more requests are sent, and the more likely a WAF is to block them
      - The default is 3
    required: false
    default: 3
    flag: "--level"
    format: "combined" # --level=3
  - name: "data"
    type: "string"
    description: |
      POST data string, used for SQL injection detection in POST requests.

      **Format:**
      - Form data format, for example: "username=admin&password=123"
      - JSON format, for example: '{"username":"admin","password":"123"}'

      **Notes:**
      - If the URL uses the POST method, provide this parameter
      - Mark the injection point in a parameter value with *
    required: false
    flag: "--data"
    format: "flag"
  - name: "cookie"
    type: "string"
    description: |
      Cookie string, used for cookie injection detection.

      **Format:**
      - Standard cookie format, for example: "sessionid=abc123; user=admin"

      **Notes:**
      - If cookie injection is present, provide this parameter
    required: false
    flag: "--cookie"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional SQLMap arguments. Use it to pass SQLMap options that are not defined in the parameter list.

      **Example values:**
      - "--dbs": list all databases
      - "--tables -D database": list the tables of the specified database
      - "--dump -D database -T table": dump table data
      - "--os-shell": get an operating system shell
      - "--risk 2": risk level (1-3)
      - "--threads 10": number of concurrent threads
      - "--tamper space2comment": use a tamper script to bypass the WAF

      **Notes:**
      - Separate multiple arguments with spaces
      - Make sure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
