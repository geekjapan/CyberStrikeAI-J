name: "nikto"
command: "nikto"
enabled: true
# Allowed exit codes: nikto returns exit code 1 when it finds vulnerabilities, which is a normal success state
allowed_exit_codes: [1]
# Short description (used in the tool list to reduce token usage)
short_description: "Web server scanner for detecting known vulnerabilities and misconfigurations in web servers and applications"
# Detailed tool description
description: |
  Web server scanner for detecting known vulnerabilities, misconfigurations, and potential security issues in web servers and applications.

  **Key features:**
  - Detect web server versions and configuration issues
  - Identify known web vulnerabilities and CVEs
  - Detect dangerous files and directories
  - Check for server misconfigurations
  - Identify outdated software versions
  - Detect default files and scripts

  **Use cases:**
  - Web application security assessment
  - Server configuration auditing
  - Vulnerability scanning and discovery
  - Early-stage penetration testing information gathering

  **Notes:**
  - Scans may generate a lot of logs; manage logs accordingly
  - Some scans may trigger WAF or IDS alerts
  - Use only within the authorized scope
  - Scan results require manual verification
# Parameter definitions
parameters:
  - name: "target"
    type: "string"
    description: |
      Target URL or IP address. Can be a full URL or an IP address.

      **Format requirements:**
      - May include the protocol (http:// or https://)
      - May be just an IP address or a domain name
      - If only an IP is given, http is used by default

      **Example values:**
      - Full URL: "http://example.com"
      - HTTPS: "https://example.com"
      - IP address: "192.168.1.1"
      - With port: "http://example.com:8080"
      - With path: "http://example.com/admin"

      **Notes:**
      - If only an IP is given, the tool uses the http protocol
      - Provide a full URL to ensure the scan is correct
      - Required parameter; cannot be empty
    required: true
    flag: "-h"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional nikto arguments. Used to pass nikto options not defined in the parameter list.

      **Example values:**
      - Add common argument examples for the tool as needed

      **Notes:**
      - Separate multiple arguments with spaces
      - Make sure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
