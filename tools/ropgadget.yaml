name: "ropgadget"
command: "ROPgadget"
enabled: true
short_description: "ROP gadget search tool"
description: |
  ROPgadget is a tool for searching ROP gadgets in binary files.

  **Key features:**
  - ROP gadget search
  - Support for many architectures
  - Gadget classification
  - Exploit chain generation

  **Use cases:**
  - Binary analysis
  - Exploit development
  - ROP chain building
  - Security research
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
      Additional ropgadget arguments. Use it to pass ropgadget options that are not defined in the parameter list.

      **Example values:**
      - Add common argument examples as appropriate for the tool

      **Notes:**
      - Separate multiple arguments with spaces
      - Make sure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
