name: "linpeas"
command: "linpeas.sh"
enabled: true
short_description: "Linux privilege escalation enumeration script that automatically detects common escalation paths"
description: |
  LinPEAS (Linux Privilege Escalation Awesome Script) is an automated privilege escalation enumeration script that detects common escalation paths on Linux systems.

  **Key features:**
  - System information gathering
  - Permission and group checks
  - Writable file and directory detection
  - SUID/SGID file discovery
  - Environment variable checks
  - Scheduled task (cron) analysis
  - Network configuration checks
  - Sensitive file discovery

  **Use cases:**
  - Privilege escalation during penetration testing
  - Security auditing
  - Post-exploitation testing
  - CTF competitions

  **Notes:**
  - linpeas.sh must already be downloaded on the target system
  - Execution may take a long time
  - Output is large; saving it to a file is recommended
parameters:
  - name: "output"
    type: "string"
    description: "Output file path (optional)"
    required: false
    flag: "-o"
    format: "flag"
  - name: "fast"
    type: "bool"
    description: "Fast mode; skips time-consuming checks"
    required: false
    flag: "-fast"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional linpeas arguments. Used to pass linpeas options not defined in the parameter list.

      **Example values:**
      - Add common argument examples for the tool as needed

      **Notes:**
      - Separate multiple arguments with spaces
      - Make sure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
