name: "kube-hunter"
command: "kube-hunter"
enabled: true
short_description: "Kubernetes penetration testing tool"
description: |
  Kube-hunter is a Kubernetes penetration testing tool for finding security issues in Kubernetes clusters.

  **Key features:**
  - Kubernetes security scanning
  - Vulnerability discovery
  - Misconfiguration detection
  - Active and passive modes

  **Use cases:**
  - Kubernetes security testing
  - Cluster security assessment
  - Penetration testing
  - Security auditing
parameters:
  - name: "target"
    type: "string"
    description: "Scan specific targets"
    required: false
    flag: "--remote"
    format: "flag"
  - name: "cidr"
    type: "string"
    description: "Scan a CIDR range"
    required: false
    flag: "--cidr"
    format: "flag"
  - name: "interface"
    type: "string"
    description: "Scan a network interface"
    required: false
    flag: "--interface"
    format: "flag"
  - name: "active"
    type: "bool"
    description: "Enable active scanning (may be risky)"
    required: false
    flag: "--active"
    format: "flag"
    default: false
  - name: "report"
    type: "string"
    description: "Report format (json, yaml)"
    required: false
    flag: "--report"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
      Additional kube-hunter arguments. Used to pass kube-hunter options not defined in the parameter list.

      **Example values:**
      - Add common argument examples for the tool as needed

      **Notes:**
      - Separate multiple arguments with spaces
      - Make sure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
