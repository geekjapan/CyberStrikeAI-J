name: "waybackurls"
command: "waybackurls"
enabled: true
short_description: "Get historical URLs from the Wayback Machine"
description: |
  Waybackurls gets the historical URLs of a target domain from the Wayback Machine.

  **Key features:**
  - Historical URL discovery
  - Version retrieval
  - Subdomain support

  **Use cases:**
  - Historical URL collection
  - Bug bounty reconnaissance
  - Security testing
  - Content discovery
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain"
    required: true
    position: 0
    format: "positional"
  - name: "get_versions"
    type: "bool"
    description: "Get URLs of all versions"
    required: false
    flag: "-get-versions"
    format: "flag"
    default: false
  - name: "no_subs"
    type: "bool"
    description: "Do not include subdomains"
    required: false
    flag: "-no-subs"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: |
      Additional waybackurls arguments. Use it to pass waybackurls options that are not defined in the parameter list.

      **Example values:**
      - Add common argument examples as appropriate for the tool

      **Notes:**
      - Separate multiple arguments with spaces
      - Make sure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
